name: Refresh committed lib

on:
  push:
    branches:
      - docs/test-contract-alignment

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: docs/test-contract-alignment

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          package-manager-cache: false

      - name: Install build tooling
        shell: bash
        run: |
          NODE_MAJOR="$(node -p "process.versions.node.split('.')[0]")"
          npm install --no-save --ignore-scripts --package-lock=false --legacy-peer-deps \
            "@types/node@${NODE_MAJOR}" \
            typescript@7.0.2

      - name: Install pinned DeepSeek Harness dependencies
        shell: bash
        run: |
          npm install --no-save --ignore-scripts --package-lock=false \
            @deepseek-ai/cordis@4.0.1 \
            @deepseek-ai/schemastery@3.18.1 \
            @deepseek-ai/dsh-agent@0.1.0-rc.6 \
            @deepseek-ai/dsh-agent-loop@0.1.0-rc.6 \
            @deepseek-ai/dsh-bash-sandbox@0.1.0-rc.6 \
            @deepseek-ai/dsh-commands@0.1.0-rc.6 \
            @deepseek-ai/dsh-jobs-local@0.1.0-rc.6 \
            @deepseek-ai/dsh-llm@0.1.0-rc.6 \
            @deepseek-ai/dsh-llm-deepseek@0.1.0-rc.6 \
            @deepseek-ai/dsh-sandbox-local@0.1.0-rc.6 \
            @deepseek-ai/dsh-sandbox-policy@0.1.0-rc.6 \
            @deepseek-ai/dsh-session@0.1.0-rc.6 \
            @deepseek-ai/dsh-shell-env@0.1.0-rc.6 \
            @deepseek-ai/dsh-subprocess-local@0.1.0-rc.6 \
            @deepseek-ai/dsh-system-prompt@0.1.0-rc.6 \
            @deepseek-ai/dsh-tool-bash@0.1.0-rc.6 \
            @deepseek-ai/dsh-tools@0.1.0-rc.6 \
            @deepseek-ai/dsh-user-approval@0.1.0-rc.6

      - name: Rebuild and commit lib
        shell: bash
        run: |
          npm run build
          if git diff --quiet -- lib; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib
          git commit -m "build: refresh committed output"
          git push origin HEAD:docs/test-contract-alignment
